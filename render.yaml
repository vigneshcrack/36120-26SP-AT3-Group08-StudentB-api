# Render Blueprint (optional): Dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: at3-group08-studentb-mri-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: STUDENT_A_URL
        sync: false
      - key: STUDENT_C_URL
        sync: false
      - key: PEER_FALLBACK_MODE
        value: missing
